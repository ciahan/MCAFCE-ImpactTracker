<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      const repo = "/MCAFCE-ImpactTracker";
      const route =
        window.location.pathname.substring(repo.length) +
        window.location.search +
        window.location.hash;

      sessionStorage.setItem("redirectPath", route);

      window.location.replace(repo + "/");
    </script>
  </head>
  <body></body>
</html>
